<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGMA Studio - Entrando...</title>
  <style>
    body { background: #09090b; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { text-align: center; }
    .spinner { width: 28px; height: 28px; border: 3px solid #27272a; border-top-color: #fafafa; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13px; color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Autenticando...</p>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var access = params.get('access_token');
      var refresh = params.get('refresh_token');
      var error = params.get('error');
      var base = window.location.pathname.replace(/google-callback\.html.*$/, '');

      if (error || !access || !refresh) {
        window.location.replace(base + 'login');
        return;
      }

      localStorage.setItem('access_token', access);
      localStorage.setItem('refresh_token', refresh);

      // Simular clique no botao de login para o React detectar a sessao
      window.location.replace(base);
    })();
  </script>
</body>
</html>
